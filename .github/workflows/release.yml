# Description: single entry point for all npm publishes.
#
# npm trusted publishing (OIDC) validates the filename of the top-level (caller) workflow, not the
# reusable workflow that runs `npm publish`. All npm publishes must therefore originate from this file,
# which dispatches to the publish-* reusable workflows based on the pushed branch.
#
# To publish from a new release branch (e.g. a custom dist-tag), add the branch below and a job that
# routes to a reusable workflow. See `.github/workflow-samples/tagged-release.yml`.

name: Release

on:
  push:
    branches: [main, hotfix]

# Permissions required for pushing tags, creating PRs, and requesting an OIDC token for npm trusted
# publishing and aws-actions/configure-aws-credentials. Called workflows can only use permissions granted here.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  latest:
    if: github.ref_name == 'main'
    uses: ./.github/workflows/publish-latest.yml
    secrets: inherit

  next:
    if: github.ref_name == 'main'
    concurrency:
      group: release-next-${{ github.sha }}
      cancel-in-progress: true
    uses: ./.github/workflows/publish-next.yml
    secrets: inherit

  hotfix:
    if: github.ref_name == 'hotfix'
    uses: ./.github/workflows/publish-hotfix.yml
    secrets: inherit
